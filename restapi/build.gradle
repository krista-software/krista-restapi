plugins {
    id 'java'
    id 'jacoco'
    id "com.github.node-gradle.node" version "3.1.0"
    id 'maven-publish'
    id("org.sonarqube") version "6.3.1.5724"
}

apply plugin: 'java-library'
group 'app.krista.extensions.development.api.rest'

/*
 * Use extension.name for archiveBaseName, extension.version for version.
 * Resulting jar: <extension.name>-<extension.version>.jar e.g. RestAPI-1.0.0.jar
 */
def computedBaseName = "Rest API"
def computedVersion = "local"
def releasePropsFile = file('release.properties')
if (releasePropsFile.exists()) {
    def props = new Properties()
    releasePropsFile.withInputStream { stream -> props.load(stream) }
    // Remove whitespace for base name, but allow dashes/underscores
    computedBaseName = (props['extension.name'] ?: "Rest API").replaceAll(/\s+/, "")
    computedVersion = props['extension.version'] ?: "local"
}
version = computedVersion

if (rootProject.file('builder.txt').canRead()) {
    ext.builder = rootProject.file('builder.txt').text.trim()
} else {
    ext.builder = "0"
}

node {
    version = '24.2.0'
    npmVersion = '10.7.0'
    yarnVersion = '1.22.17'
    download = true
    workDir = file("${project.projectDir}/src/main/ui/restapiauth/nodejs")
    npmWorkDir = file("${project.projectDir}/src/main/ui/restapiauth/npm")
    yarnWorkDir = file("${project.projectDir}/src/main/ui/restapiauth/yarn")
    nodeModulesDir = file("${project.projectDir}/src/main/ui/restapiauth/")
}

tasks.register('updateVersion') {
    doFirst {
        project.ext.newbuilder = Integer.parseInt(project.ext.builder) + 1
        print "Building extension version: " + version.toString() + "-" + project.ext.newbuilder
        rootProject.file('builder.txt').text = project.ext.newbuilder
        System.clearProperty("extensionVersion")
        System.setProperty("extensionVersion", version.toString() + "-" + project.ext.newbuilder)
    }
}

System.setProperty("extensionVersion", version.toString())

sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    maven {
        url "https://packages.cicd.in.antbrains.com/artifactory/libs-release"
    }
    mavenCentral()
    mavenLocal()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all,-serial'
}

tasks.register('compile') {
    dependsOn compileJava
}

tasks.named('compileTestJava') {
    dependsOn(tasks.named('buildAndCopyUI'))
}

configurations {
    implementation {
        canBeConsumed = false
        canBeResolved = true
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            afterEvaluate {
                artifactId = jar.archiveBaseName.get()
                groupId = rootProject.group
            }
        }
    }
    repositories {
        mavenLocal()
        maven {
            credentials {
                username = rootProject.properties['MAVEN_USERNAME']
                password = rootProject.properties['MAVEN_PASSWORD']
            }
            authentication {
                basic(BasicAuthentication)
            }
            url rootProject.properties['MAVEN_UPLOAD_URL']
        }
    }
}

dependencies {
    annotationProcessor 'app.krista:extension-impl-anno-processors:1.0.118'
    implementation 'app.krista:krista-apis:1.0.118'
    implementation 'org.glassfish.hk2:hk2-api:3.0.6'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'org.glassfish.jersey.media:jersey-media-multipart:2.41'

    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

sonar {
    properties {
        property("sonar.projectName", "SonarScanner for Krista Global Catalog (Rest API with JaCoCo code coverage)")
        property("sonar.projectKey", "sonar-scanner-restapi")
        property("sonar.sources", "src/main/java")
        property("sonar.tests", "src/test/java")
        property("sonar.java.binaries", "build/classes/java/main")
        property("sonar.java.test.binaries", "build/classes/java/test")
        property("sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml")
        property("sonar.junit.reportPaths", "build/test-results/test")
    }
}

tasks.register('createSourceDir', Exec) {
    dependsOn processResources
    commandLine "mkdir", "-p", "$projectDir/build/classes/java/main/META-INF/project"
}

tasks.register('copyGradleFile', Exec) {
    dependsOn createSourceDir
    commandLine "cp", "$projectDir/build.gradle", "$projectDir/build/classes/java/main/META-INF/project/build.gradle"
}

tasks.register('includeSources', Exec) {
    dependsOn copyGradleFile
    commandLine "cp", "-r", "$projectDir/src", "$projectDir/build/classes/java/main/META-INF/project/src"
}


import java.util.regex.Pattern

tasks.register('generateReleaseProperties') {
    group = 'build'
    description = 'Generates release.properties file with extension version and domain information'

    doLast {
        def extensionFilePath = 'src/main/java/app/krista/extensions/development/api/rest/RestApiExtension.java'
        def areaFilePath = 'src/main/java/app/krista/extensions/development/api/rest/catalog/DownloadArea.java'

        def extensionFile = project.file(extensionFilePath)
        def areaFile = project.file(areaFilePath)

        if (!extensionFile.exists()) {
            throw new GradleException("Extension file not found: ${extensionFilePath}")
        }

        if (!areaFile.exists()) {
            throw new GradleException("Area file not found: ${areaFilePath}")
        }

        def properties = new Properties()
        // Pre-compile the regex pattern for better performance
        def keyValuePattern = Pattern.compile(/(\w+)\s*=\s*"([^"]+)"/)

        // Extract Extension annotation information
        extractAnnotationInfo(extensionFile, "@Extension", keyValuePattern) { key, value ->
            if (key == "version") {
                properties.setProperty("extension.version", value)
                logger.lifecycle("Found extension version: ${value}")
            } else if (key == "name") {
                properties.setProperty("extension.name", value)
                logger.lifecycle("Found extension name: ${value}")
            }
        }

        // Set default extension name if not found
        if (!properties.getProperty('extension.name')) {
            properties.setProperty("extension.name", "Rest API")
            logger.lifecycle("Set default extension name: Rest API")
        }

        // Extract Domain annotation information
        extractAnnotationInfo(areaFile, "@Domain", keyValuePattern) { key, value ->
            if (key == "name") {
                properties.setProperty("domain.name", value)
                logger.lifecycle("Found domain name: ${value}")
            } else if (key == "ecosystemName") {
                properties.setProperty("ecosystem.name", value)
                logger.lifecycle("Found ecosystem name: ${value}")
            }
        }

        if (!properties.getProperty('extension.version')) {
            throw new GradleException("Could not find extension version in ${extensionFilePath}")
        }

        // Set default values if not found in annotations
        if (!properties.getProperty('domain.name')) {
            properties.setProperty("domain.name", "Development")
            logger.lifecycle("Set default domain name: Development")
        }

        if (!properties.getProperty('ecosystem.name')) {
            properties.setProperty("ecosystem.name", "Essentials")
            logger.lifecycle("Set default ecosystem name: Essentials")
        }

        def releasePropertiesFile = project.file('release.properties')
        // Write properties in specific order for Jenkins script compatibility
        def orderedContent = [
            "extension.name=${properties.getProperty('extension.name')}",
            "extension.version=${properties.getProperty('extension.version')}",
            "domain.name=${properties.getProperty('domain.name')}",
            "ecosystem.name=${properties.getProperty('ecosystem.name')}"
        ].join('\n')
        releasePropertiesFile.text = orderedContent + '\n'
        logger.lifecycle("Generated release.properties with content:\n${orderedContent}")
    }
}

// Helper method to extract annotation information
def extractAnnotationInfo(File file, String annotationName, Pattern keyValuePattern, Closure processProperty) {
    StringBuilder annotationText = new StringBuilder()
    boolean inAnnotation = false
    file.eachLine { line ->
        line = line.trim()
        if (line.contains(annotationName)) {
            inAnnotation = true
            annotationText.setLength(0) // Reset the buffer when starting a new annotation
            annotationText.append(line)
        } else if (inAnnotation) {
            annotationText.append(line)
        }

        if (inAnnotation && line.contains(")")) {
            inAnnotation = false
            def matcher = keyValuePattern.matcher(annotationText.toString())
            while (matcher.find()) {
                def key = matcher.group(1)
                def value = matcher.group(2)
                processProperty.call(key, value)
            }
        }
    }
}

tasks.register('bundleUI', YarnTask) {
    dependsOn 'nodeSetup'
    dependsOn 'yarnSetup'
    dependsOn 'yarn'
    execOverrides {
        it.workingDir = "src/main/ui/restapiauth"
        it.environment("CI", "false")
    }
    args = ['build']
}

tasks.register('filepermission', Exec) {
    commandLine('chmod', '-R', '755', "${project.projectDir}/src/main/ui/restapiauth")
}

tasks.register('buildAndCopyUI', Copy) {
    dependsOn(tasks.named("bundleUI"))
    from("${project.projectDir}/src/main/ui/restapiauth/build")
    into("${project.buildDir}/resources/main/ui/restapiauth")
}

tasks.register('buildUI') {
    dependsOn(tasks.named('buildAndCopyUI'))
    dependsOn(tasks.named('filepermission'))
}

tasks.register('cleanDir', Delete) {
    delete("${project.projectDir}/main/ui/restapiauth/build")
    delete("${project.buildDir}/resources/ui/restapiauth")
}

tasks.register('candidate', Exec) {
    commandLine "env",
            "DOCKER_UPLOAD_REPO=" + rootProject.properties['DOCKER_UPLOAD_REPO'],
            "MAVEN_URL=" + System.properties['MAVEN_URL'],
            "MAVEN_UPLOAD_URL=" + rootProject.properties['MAVEN_UPLOAD_URL'],
            "MAVEN_USERNAME=" + rootProject.properties['MAVEN_USERNAME'],
            "MAVEN_PASSWORD=" + rootProject.properties['MAVEN_PASSWORD'],
            "bash", "candidate.sh"
    standardOutput = new ByteArrayOutputStream()
    ext.output = {
        return standardOutput.toString()
    }
}

tasks.register('release', Exec) {
    commandLine "env",
            "DOCKER_UPLOAD_REPO=" + rootProject.properties['DOCKER_UPLOAD_REPO'],
            "MAVEN_URL=" + System.properties['MAVEN_URL'],
            "MAVEN_UPLOAD_URL=" + rootProject.properties['MAVEN_UPLOAD_URL'],
            "MAVEN_USERNAME=" + rootProject.properties['MAVEN_USERNAME'],
            "MAVEN_PASSWORD=" + rootProject.properties['MAVEN_PASSWORD'],
            "bash", "release.sh"
    standardOutput = new ByteArrayOutputStream()
    ext.output = {
        return standardOutput.toString()
    }
}

tasks.named("jar") {
    dependsOn tasks.named("generateReleaseProperties")
    dependsOn tasks.named("buildAndCopyUI")
}

jar {
    // Without this dependency, the jar task may use the fallback "local" value if the file is not available during configuration.
    archiveBaseName.set(computedBaseName)

    doFirst {
        // Wait for half a second to ensure generateReleaseProperties file is fully generated
        println "Waiting half second for generateReleaseProperties to complete..."
        Thread.sleep(500)
        println "Wait complete, proceeding with jar creation..."

        // Re-read the release.properties file at execution time to get the correct values
        def jarReleasePropsFile = file('release.properties')
        if (jarReleasePropsFile.exists()) {
            def props = new Properties()
            jarReleasePropsFile.withInputStream { stream -> props.load(stream) }
            // Use extension.name if available, otherwise fall back to default
            def actualBaseName = (props['extension.name'] ?: "Rest API").replaceAll(/\s+/, "")
            def actualVersion = props['extension.version'] ?: "local"

            println "Using jar name from release.properties: ${actualBaseName}-${actualVersion}.jar"

            // Update the archive base name and version at execution time
            archiveBaseName.set(actualBaseName)
            archiveVersion.set(actualVersion)
        } else {
            println "release.properties not found, using fallback values"
        }
    }

    manifest {}
    from {
        configurations.implementation.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    duplicatesStrategy = "exclude"
}